name = "stroke-web"
# "stroke" account: kept separate so other projects' free-tier usage can't take stroke.click down.
account_id = "dd717ae06a58b724464895bb4258c94f"
compatibility_date = "2025-10-01"
main = "src/server.ts"
compatibility_flags = ["nodejs_compat"]
preview_urls = true

# Official custom domain (zone already configured in Cloudflare)
routes = [{ pattern = "stroke.click", custom_domain = true }]

# Powers the free AI tier (/api/ai/*). The free neuron allocation is per ACCOUNT
# and shared across all users, so src/lib/ai/free-tier.ts caps usage app-wide.
[ai]
binding = "AI"

# No scheduled jobs. (The weekly giveaway draw ran here until it ended.)
[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "stroke-web"
database_id = "eb8fdefd-8064-49b7-83fa-4336580068eb"
migrations_dir = "drizzle"

# Encrypted share-link blobs (ciphertext only; keys never reach the server).
[[r2_buckets]]
binding = "SHARES"
bucket_name = "stroke-shares"

# Scheduled backups sent to Stroke Cloud (src/lib/backups/service.ts).
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "stroke-backups"

# Shared studio relay (Labs): one object per shared room. It forwards
# end-to-end encrypted calls between a studio page and the sharing machine.
[[durable_objects.bindings]]
name = "STUDIO_RELAY"
class_name = "StudioRelay"

[[migrations]]
tag = "v1-studio-relay"
new_sqlite_classes = ["StudioRelay"]

[vars]
VITE_BASE_URL = "https://stroke.click"
DODO_ENVIRONMENT = "live_mode"
# Secrets: set via wrangler secret put <NAME>
# DODO_PAYMENTS_API_KEY, DODO_WEBHOOK_KEY, DODO_PRODUCT_ID, LICENSE_PRIVATE_KEY_HEX
# DODO_TEAM_PRODUCT_ID (optional) — enables the $99 Team plan covering an email domain
# GROQ_API_KEY, CEREBRAS_API_KEY, OPENROUTER_POOL_KEY (all optional) — the free-tier
#   overflow chain, tried in that order when Workers AI fails or its daily cap trips.
#   Unset ones are skipped; with none set, the free tier 429s instead of falling back.
# GITHUB_TOKEN (optional) — raises the GitHub API rate limit for /api/releases
# PLUNK_API_KEY (optional) — Plunk SECRET key (sk_...) for transactional email;
#   when unset, purchase/failure emails are skipped. Sender: PLUNK_FROM_EMAIL
#   (defaults to noreply@stroke.click; the domain must be verified in Plunk)

[assets]
directory = "./public"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
